<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단</title>
</head>
<body>
    <h1>구구단</h1>
    <script>
    let dan = 2;
    while (dan <= 9) {
        document.write("<h1>" + dan + "단</h1>");

        let i = 1;
        while (i <= 9) {
            document.write(dan + " x " + i + " = " + (dan * i) + "<br>");
            i++;
        }

        document.write("<br>");
        dan++;
    }
</script>
</body>
</html>
